name: Deploy — Cloudflare Workers (reusable)

# Reusable: checkout → install wrangler → wrangler deploy [--env staging]
#
# Caller pattern (e.g. rolliq-com/site deploy.yml):
#   jobs:
#     deploy-staging:
#       if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
#       uses: infra-commons/devops/.github/workflows/cloudflare-deploy-reusable.yml@main
#       permissions:
#         contents: read   # a called workflow cannot hold more than its caller grants
#       with:
#         environment: staging
#       secrets:
#         cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#         cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#
# Resulting check name: "<caller_job_id> / deploy"
# Add "deploy-staging / deploy" to required_status_checks for staging gate.

on:
  workflow_call:
    inputs:
      environment:
        description: "'staging' uses --env staging; 'production' omits --env"
        required: true
        type: string
      wrangler_version:
        description: "Wrangler major version to install via npm (default: 4)"
        required: false
        type: string
        default: "4"
    secrets:
      cloudflare_api_token:
        required: true
      cloudflare_account_id:
        required: true

permissions: {}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install wrangler
        run: npm install -g "wrangler@${{ inputs.wrangler_version }}"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare_api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare_account_id }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          # Only "staging" and "production" are meaningful (per the input's own
          # description). Anything else — a typo, wrong case, a stray space —
          # used to fall through to the else branch and deploy to PRODUCTION
          # with no warning. Enumerate explicitly instead of defaulting the
          # unrecognized case to the more dangerous path.
          case "$DEPLOY_ENV" in
            staging)
              wrangler deploy --env staging
              ;;
            production)
              wrangler deploy
              ;;
            *)
              echo "::error::environment must be 'staging' or 'production', got '$DEPLOY_ENV'"
              exit 1
              ;;
          esac
