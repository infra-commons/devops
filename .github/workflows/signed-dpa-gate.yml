name: Signed-DPA deploy gate (reusable)

# Reusable: verifies that a production client has a current signed DPA before deployment.
# Fails the deploy if the DPA record is not in an acceptable state, or the sub-processor
# disclosure is older than max_sub_processor_age_days.
#
# A DPA record is acceptable in exactly two ways:
#
#   status: signed         an agreement was executed with a counterparty. Must carry
#                          signed_original_link (an absolute http(s) URL to the executed
#                          document), signed_date and version.
#   status: self_attested  there is no counterparty: the operator is both controller and
#                          processor of the data this deployment handles, so no document
#                          exists to link. Accepted ONLY where tags.data_class is
#                          `internal`.
#
# Why the evidence requirement exists. `signed` on its own is a self-declared string. A
# record that says `signed` and points at nothing is indistinguishable, to the gate and to
# any auditor reading the config, from one backed by an executed agreement — so the gate
# passed for both and reported success either way. Requiring the record to name the
# document makes the two cases different in the only place a machine can see.
#
# Why the link is not fetched. Presence and well-formedness only, never resolvability. A
# canonical link to an executed agreement is typically permission-gated (a shared drive),
# so fetching it would need document-store credentials on the deploy path and could not
# distinguish a 403 from a dead link. Such a check either fails open — the exact defect
# this closes — or blocks production deploys on a permissions quirk unrelated to whether
# the agreement exists.
#
# Why self_attested is a status rather than an exemption. Letting internal deployments
# skip the evidence rule would express the exception as a filter on the gate's input, and
# the gate would lose the ability to report on its own exceptions: nothing downstream
# could count how many deployments rely on one. As a status it is a value in the config,
# greppable and visible in this job's log.
#
# Caller pattern (add before the production deploy job):
#
#   jobs:
#     dpa-gate:
#       uses: infra-commons/devops/.github/workflows/signed-dpa-gate.yml@main
#       with:
#         client_slug: ${{ inputs.client_slug }}
#       secrets:
#         # PREFERRED — the gate mints its own installation token per run.
#         clients_config_app_id:      ${{ secrets.CLIENTS_CONFIG_APP_ID }}
#         clients_config_private_key: ${{ secrets.CLIENTS_CONFIG_PRIVATE_KEY }}
#         # LEGACY, still supported — pass this INSTEAD of the pair above.
#         # clients_config_token: ${{ secrets.CLIENTS_CONFIG_READ_TOKEN }}
#
#     deploy-production:
#       needs: dpa-gate
#       ...
#
# Credentials in the calling org — supply EXACTLY ONE of:
#
#   1. CLIENTS_CONFIG_APP_ID + CLIENTS_CONFIG_PRIVATE_KEY (preferred) — a GitHub App
#      installed on the OWNER of clients_config_repo with `contents: read` on it. The
#      gate mints a fresh installation token itself, so there is nothing to expire and
#      nothing to re-grant when a machine identity's org membership changes.
#
#   2. CLIENTS_CONFIG_READ_TOKEN (legacy) — a fine-grained PAT with `contents: read` on
#      the clients-config repo, or an App installation token the caller minted itself.
#
# Why the caller cannot just mint one and pass it in as (2): this gate is invoked as a
# `uses:` job, so no step can run before it, and minting in an EARLIER job then handing
# the value over via `needs.*.outputs` does not work — create-github-app-token registers
# its output as a secret, and GitHub silently drops any job output containing one, so the
# gate would receive an empty string. The mint has to happen inside this workflow. That is
# the whole reason option 1 exists.
#
# Resulting check name: "<caller_job_id> / dpa-gate"
# Add it to required_status_checks to hard-block production deploys without a signed DPA.

on:
  workflow_call:
    inputs:
      client_slug:
        description: "Client slug matching clients/{slug}.yaml in clients-config"
        required: true
        type: string
      clients_config_repo:
        description: "Org/repo containing client YAML files (default: rolliq-com/clients-config)"
        required: false
        type: string
        default: rolliq-com/clients-config
      clients_config_ref:
        description: "Git ref to read from clients-config"
        required: false
        type: string
        default: main
      max_sub_processor_age_days:
        description: >
          Maximum age (days) for sub_processors_current_as_of before the gate fails.
          Set to 0 to disable the age check.
        required: false
        type: number
        default: 365
    secrets:
      # Two ways to authenticate, in this order of preference. Both are optional at the
      # schema level and exactly one must actually arrive — see the fail-closed check in
      # the first step below, which is what turns "neither supplied" into a legible error
      # instead of a 404 that reads like a bad client_slug.
      #
      # `required: true` on the legacy secret was itself the trap: a caller could not add
      # the App pair without also passing a secret this workflow refused to make optional,
      # and could not drop it either, so a dead PAT could only be replaced by rotating it.
      # That is why rolliq-com/solution-recruitment-reference-check's promote sat blocked
      # with a working alternative it had no way to hand over (its own promote-to-production.yml
      # carries the analysis, and a commented-out cross-job attempt that cannot work — see below).
      clients_config_app_id:
        description: >
          App ID of a GitHub App installed on the clients_config_repo owner with
          contents:read. Preferred over clients_config_token: an App-minted installation
          token is created per run and cannot expire or outlive its identity's membership.
        required: false
      clients_config_private_key:
        description: >
          Private key for clients_config_app_id. Presence of THIS secret is what selects
          the App path — the app id alone is a public identifier and does not.
        required: false
      clients_config_token:
        description: >
          LEGACY. A GitHub token with contents:read on clients_config_repo — a fine-grained
          PAT, or an App installation token minted by the caller. Still fully supported, and
          used whenever the App pair above is absent, so no existing caller needs to change.
          Prefer the App pair for anything new: a PAT carries an expiry, and it also stops
          working — silently, as a 404 — if its identity loses membership of the org that
          owns clients_config_repo.
        required: false

permissions: {}

jobs:
  dpa-gate:
    name: dpa-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Surfaced as env so the `if:` below can test them. `secrets` is not available in a
      # step-level `if:` expression; env is. Same shape capture-findings-reusable.yml uses.
      CC_APP_KEY: ${{ secrets.clients_config_private_key }}
      CC_TOKEN: ${{ secrets.clients_config_token }}

    steps:
      # Split owner/name once, here, rather than inline twice below. Note this mints against
      # the owner of clients_config_repo, NOT github.repository_owner — this gate reads a
      # DIFFERENT org's repo than the caller lives in, which is the one place it diverges from
      # capture-findings-reusable.yml's otherwise-identical minting block.
      - name: Resolve clients-config owner and name
        id: cc
        env:
          REPO: ${{ inputs.clients_config_repo }}
        run: |
          if [[ "$REPO" != */* || "$REPO" == */*/* ]]; then
            echo "::error::clients_config_repo must be exactly owner/name, got '${REPO}'"
            exit 1
          fi
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO##*/}"  >> "$GITHUB_OUTPUT"

      - name: Mint clients-config token from the App pair
        id: cc-token
        if: ${{ env.CC_APP_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.clients_config_app_id }}
          private-key: ${{ secrets.clients_config_private_key }}
          owner: ${{ steps.cc.outputs.owner }}
          repositories: ${{ steps.cc.outputs.name }}
          # REQUIRED, not tidiness. `permission-*` inputs REPLACE the installation's grant
          # rather than narrowing it additively, so omitting this mints a token with no
          # contents access at all and the fetch below 404s exactly like the dead PAT did
          # (infra-commons/meta#661).
          permission-contents: read

      # No `continue-on-error` here, deliberately — unlike capture-findings, where a failed
      # mint degrades to skipping an optional board-add. This gate has nothing to degrade to:
      # its whole job is to refuse a production promote without a signed DPA, so a mint that
      # fails must fail the gate rather than fall through to the legacy branch and report a
      # confusing downstream error.

      - name: Fetch client config
        env:
          GH_TOKEN: ${{ steps.cc-token.outputs.token || secrets.clients_config_token }}
          REPO: ${{ inputs.clients_config_repo }}
          REF: ${{ inputs.clients_config_ref }}
          SLUG: ${{ inputs.client_slug }}
        run: |
          # Fail closed and legibly when NEITHER credential arrived. Both secrets are optional
          # at the schema level (they have to be, or a caller can never migrate off the legacy
          # one), so this is where "exactly one is required" is actually enforced. Without it an
          # empty Bearer token produces the same 404 as a wrong slug.
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::No clients-config credential supplied. Pass either the App pair (clients_config_app_id + clients_config_private_key, preferred) or the legacy clients_config_token."
            exit 1
          fi

          # NOTE: no `-f`. GitHub runs `run:` under `bash -e`, so with `-f` curl exits non-zero
          # on any HTTP error and the step dies AT THIS LINE — the diagnostics below never run
          # and the operator gets a bare exit code instead. The explicit status check is the
          # thing that reports, so curl must be allowed to return normally.
          HTTP=$(curl -s -o client.yaml -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${REPO}/contents/clients/${SLUG}.yaml?ref=${REF}")

          if [[ "$HTTP" == "404" ]]; then
            # A 404 here has TWO causes and they need opposite fixes. GitHub returns 404 rather
            # than 403 when hiding a private repo from an identity that cannot see it, so a
            # credential that is perfectly valid — unexpired, still authenticating — reads as
            # "this file does not exist" the moment its identity loses membership of the org
            # owning ${REPO}. That is exactly what took rolliq-com's promote down on 2026-08-19,
            # and the previous version of this message sent the reader to check the slug and
            # rotate the token, neither of which would have helped.
            echo "::error::Cannot fetch clients/${SLUG}.yaml from ${REPO}@${REF} (HTTP 404). Two distinct causes: (a) the file genuinely is not there — check client_slug and clients_config_ref; or (b) the credential's identity cannot SEE ${REPO}, which GitHub reports as 404, not 403. For (b) rotating the token does not help — the identity needs access, or switch to the App pair (clients_config_app_id + clients_config_private_key) with the App installed on ${REPO}."
            exit 1
          fi

          if [[ "$HTTP" != "200" ]]; then
            echo "::error::Cannot fetch clients/${SLUG}.yaml from ${REPO}@${REF} (HTTP ${HTTP}). Check the clients-config credential's contents:read scope on that repo."
            exit 1
          fi

      - name: Verify signed DPA
        env:
          SLUG: ${{ inputs.client_slug }}
          MAX_AGE_DAYS: ${{ inputs.max_sub_processor_age_days }}
        run: |
          python3 - <<'PYEOF'
          import sys, os, datetime, urllib.parse

          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.run([sys.executable, "-m", "pip", "install", "pyyaml", "-q"], check=True)
              import yaml

          slug = os.environ["SLUG"]
          max_age = int(os.environ["MAX_AGE_DAYS"])

          with open("client.yaml") as f:
              client = yaml.safe_load(f)

          errors = []

          # A record with no counterparty may use this status instead of borrowing
          # `signed`, but only where the data is the operator's own. Any other data class
          # implies a counterparty, and therefore an agreement that can be pointed at.
          SELF_ATTESTED_DATA_CLASS = "internal"

          def well_formed_link(value):
              """True for an absolute http(s) URL. Deliberately narrower than the config
              schema's `format: uri`, which also admits schemes (urn:, mailto:) that are
              not a retrievable document. A file that passes the schema but fails here
              fails LOUDLY at deploy time with the message below, rather than deploying
              on a link nobody can open. Keep the two in step: this is the stricter end
              of one contract split across two repositories."""
              if not isinstance(value, str) or not value.strip():
                  return False
              parts = urllib.parse.urlsplit(value.strip())
              return parts.scheme in ("http", "https") and bool(parts.netloc)

          # Shape guards. This file comes from another repository and is parsed, not
          # validated, here — so a malformed block must produce an ::error:: the operator
          # can act on, never a traceback. An unexplained step failure is
          # indistinguishable from an infrastructure blip and tends to get retried
          # rather than fixed.
          if not isinstance(client, dict):
              client = {}

          contracts = client.get("contracts")
          if not contracts or not isinstance(contracts, dict):
              errors.append(
                  f"client '{slug}' has no usable 'contracts' block — "
                  "a signed DPA is required before production deployment"
              )
          else:
              dpa = contracts.get("dpa")
              if not dpa or not isinstance(dpa, dict):
                  errors.append(
                      f"client '{slug}' has no usable 'contracts.dpa' block — "
                      "add the DPA record to clients-config before deploying to production"
                  )
              else:
                  status = dpa.get("status", "none")
                  tags = client.get("tags")
                  data_class = tags.get("data_class") if isinstance(tags, dict) else None

                  if status not in ("signed", "self_attested"):
                      errors.append(
                          f"client '{slug}' DPA status is '{status}' — "
                          "status must be 'signed' before production deployment "
                          "(or 'self_attested', for a deployment whose data has no "
                          "external counterparty)"
                      )
                  elif status == "signed":
                      # `signed` has to name the executed document, the version executed,
                      # and when. Reported as three separate errors so one run tells the
                      # operator everything that is missing.
                      link = dpa.get("signed_original_link")
                      if link is None or not str(link).strip():
                          errors.append(
                              f"client '{slug}' DPA status is 'signed' but "
                              "'contracts.dpa.signed_original_link' is missing — a signed "
                              "DPA must point at the executed document. Add the canonical "
                              "link, or use status 'self_attested' if no counterparty "
                              "agreement exists"
                          )
                      elif not well_formed_link(link):
                          errors.append(
                              f"client '{slug}' 'contracts.dpa.signed_original_link' is not "
                              "an absolute http(s) URL — the gate checks the link is "
                              "well-formed, never that it resolves, so it must at least be "
                              "a link"
                          )
                      for field in ("signed_date", "version"):
                          value = dpa.get(field)
                          if value is None or not str(value).strip():
                              errors.append(
                                  f"client '{slug}' DPA status is 'signed' but "
                                  f"'contracts.dpa.{field}' is missing — record which "
                                  "version was executed and when"
                              )
                  elif status == "self_attested":
                      if data_class != SELF_ATTESTED_DATA_CLASS:
                          errors.append(
                              f"client '{slug}' DPA status is 'self_attested' but "
                              f"tags.data_class is "
                              f"'{data_class if data_class is not None else '(unset)'}', "
                              f"not '{SELF_ATTESTED_DATA_CLASS}' — self_attested means "
                              "there is no external counterparty and so no document to "
                              "link, which is only true of the operator's own data. A "
                              "deployment handling anyone else's data needs an executed "
                              "agreement (status 'signed'). Do not reclassify the data to "
                              "fit the contract"
                          )

                  if max_age > 0:
                      sp_str = dpa.get("sub_processors_current_as_of")
                      if not sp_str:
                          errors.append(
                              f"client '{slug}' missing 'contracts.dpa.sub_processors_current_as_of' — "
                              "add the date the disclosed sub-processor list was last accurate"
                          )
                      else:
                          try:
                              sp_date = datetime.date.fromisoformat(str(sp_str))
                          except ValueError:
                              errors.append(
                                  f"client '{slug}' 'contracts.dpa.sub_processors_current_as_of' "
                                  f"is {sp_str!r} — not a valid ISO date (YYYY-MM-DD)"
                              )
                          else:
                              age_days = (datetime.date.today() - sp_date).days
                              if age_days > max_age:
                                  errors.append(
                                      f"client '{slug}' sub_processors_current_as_of is {age_days} days old "
                                      f"(max {max_age} days) — the DPA sub-processor disclosure is stale; "
                                      "issue a change notice or update the DPA before deploying"
                                  )

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          # Report WHICH of the two acceptable states was satisfied, and on what evidence.
          # A pass that renders identically for an executed agreement and for a record
          # with no counterparty would put the original defect straight back into the log:
          # the operator reading it could not tell the two apart either.
          dpa_record = client["contracts"]["dpa"]
          final_status = dpa_record["status"]
          print(f"DPA gate passed for '{slug}'.")
          print(f"  status: {final_status}")
          if final_status == "signed":
              print(f"  executed document: {dpa_record['signed_original_link']}")
              print(f"  version {dpa_record['version']} executed {dpa_record['signed_date']}")
              print("  (link checked for well-formedness only — NOT fetched, NOT resolved)")
          else:
              print(
                  f"  no counterparty agreement: self-attested on data_class "
                  f"'{SELF_ATTESTED_DATA_CLASS}'. This deployment passed WITHOUT an "
                  f"executed DPA, by design."
              )
          print(f"  sub_processors_current_as_of: {dpa_record.get('sub_processors_current_as_of', 'N/A')}")
          PYEOF
